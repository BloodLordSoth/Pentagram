name: CI flow

on:
  pull_request:
    branch: [ addtests ]

jobs:
  run_tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: clean install
        run: npm ci

      - name: prettier check
        run: npm run prettier:check
      
      - name: run test
        run: npm run test
